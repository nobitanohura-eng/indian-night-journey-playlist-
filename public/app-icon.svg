<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09070f"/>
      <stop offset="50%" stop-color="#140f21"/>
      <stop offset="100%" stop-color="#050408"/>
    </linearGradient>

    <!-- Metallic Gold Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Bus Windshield Glow -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Headlight Beam Radial Glow -->
    <radialGradient id="headlightBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Speed Streak -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="105" ry="105" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8"/>

  <!-- Night Sky Stars -->
  <circle cx="80" cy="90" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="160" cy="70" r="1.5" fill="#fcd34d" opacity="0.8"/>
  <circle cx="340" cy="110" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="430" cy="85" r="1.8" fill="#93c5fd" opacity="0.7"/>

  <!-- Rain Drops on Glass -->
  <line x1="120" y1="40" x2="100" y2="100" stroke="#a5f3fc" stroke-width="2" opacity="0.3" stroke-dasharray="8,12"/>
  <line x1="260" y1="30" x2="240" y2="90" stroke="#a5f3fc" stroke-width="2" opacity="0.4" stroke-dasharray="10,14"/>
  <line x1="390" y1="50" x2="370" y2="110" stroke="#a5f3fc" stroke-width="2" opacity="0.3" stroke-dasharray="6,10"/>

  <!-- Headlight Ground Reflection Glare -->
  <ellipse cx="256" cy="420" rx="190" ry="35" fill="url(#headlightBeam)" />

  <!-- Road Speed Lines -->
  <line x1="60" y1="440" x2="452" y2="440" stroke="url(#streakGrad)" stroke-width="4"/>
  <line x1="100" y1="455" x2="412" y2="455" stroke="url(#streakGrad)" stroke-width="2" opacity="0.6"/>

  <!-- SLEEK 90s VOLVO SLEEPER BUS GRAPHIC (Front Perspective) -->
  <g transform="translate(0, 10)">
    <!-- Bus Body Outline & Roof -->
    <path d="M 146 170 Q 256 140 366 170 L 376 340 Q 376 360 356 365 L 156 365 Q 136 360 136 340 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="4" filter="url(#glow)"/>

    <!-- Top Destination Board ("NIGHT EXPRESS") -->
    <rect x="176" y="165" width="160" height="22" rx="4" fill="#020617" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="256" y="180" font-family="monospace" font-weight="bold" font-size="12" fill="#fbbf24" text-anchor="middle" letter-spacing="3">NIGHT EXPRESS</text>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 154 200 Q 256 185 358 200 L 352 275 Q 256 285 160 275 Z" fill="url(#windshieldGrad)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wiping Wiper Blades -->
    <line x1="210" y1="270" x2="250" y2="215" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="270" x2="340" y2="215" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Driver & Passenger Silhouette inside Cabin -->
    <circle cx="210" cy="240" r="10" fill="#020617" opacity="0.8"/>
    <path d="M 195 260 Q 210 248 225 260 Z" fill="#020617" opacity="0.8"/>

    <!-- Chrome Front Grille & Volvo Logo -->
    <rect x="176" y="295" width="160" height="28" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <line x1="186" y1="304" x2="326" y2="304" stroke="#475569" stroke-width="2"/>
    <line x1="186" y1="314" x2="326" y2="314" stroke="#475569" stroke-width="2"/>
    <circle cx="256" cy="309" r="7" fill="#f59e0b"/>

    <!-- Glowing Dual Amber Headlights -->
    <!-- Left Headlight -->
    <rect x="146" y="295" width="24" height="28" rx="4" fill="#fef08a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <circle cx="158" cy="309" r="6" fill="#ffffff"/>

    <!-- Right Headlight -->
    <rect x="342" y="295" width="24" height="28" rx="4" fill="#fef08a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <circle cx="354" cy="309" r="6" fill="#ffffff"/>

    <!-- Fog Lights -->
    <circle cx="160" cy="340" r="5" fill="#f59e0b"/>
    <circle cx="352" cy="340" r="5" fill="#f59e0b"/>

    <!-- License Plate ("INJ 90S") -->
    <rect x="226" y="334" width="60" height="16" rx="2" fill="#fef08a" stroke="#000000" stroke-width="1"/>
    <text x="256" y="346" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000" text-anchor="middle">IND 90S</text>
  </g>
</svg>
